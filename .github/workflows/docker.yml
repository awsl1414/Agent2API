name: docker

# 构建网关镜像（amd64 + arm64）并推送到 GitHub 容器镜像库。
#
# ── 为什么 fork 里要单独一份 ──────────────────────────────────
# 上游在 v3.3.0-beta.1 把镜像构建搬去了独立构建仓（Agent2Builder），
# 本仓库那份随之删除。fork 没有那个构建仓的凭据，镜像也就一直没发。
# 现在改回仓内直构，与 build.yml 的处理方式一致：
#   · 只推 GHCR（ghcr.io/<owner>/agent2api），用内置 GITHUB_TOKEN 登录，
#     顶层给 packages: write 即可，不需要配任何 secret；
#   · Docker Hub 只在配了 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 时才推，
#     镜像名跟着凭据里的用户名走。fork 目前没配，这一步整体跳过，
#     工作流照常绿。
#
# ⚠️ GHCR 的**新包默认私有**：首次推送后要去包的设置里手动改成 Public，
# 否则别人 docker pull 会 401（这一步只能人工点，API 改不了默认值）。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · 推送 v* tag：正式版出 <版本> + :latest；带 `-` 的预发布版只出
#     <版本> + 滚动 :beta，**不动 :latest**
#   · 手动 workflow_dispatch(version)：对**已存在的 tag** 补发镜像，
#     适用于 tag 推上去时镜像任务失败、或旧版本补发；不填 version 时
#     对当前分支出 :dev
#   · 手动 workflow_dispatch(initial_latest)：只把主分支当前提交构建一次
#     并打 :latest —— 仓库还没有正式版 Release 时可先给 :latest 一个起点，
#     之后每次正式版发版自然接续。不影响任何已有的版本标签。
#
# ── 为什么 :latest 只跟正式版走 ──────────────────────────────
# 应用里的「加入 beta 版」是一次显式选择；`docker pull :latest` 的人
# 没做这个选择。推一次 beta 就换掉 :latest 等于绕过了那道开关。
#
# ── runner 上不装 QEMU ───────────────────────────────────────
# Dockerfile 的 builder 固定在 $BUILDPLATFORM：runner 是 amd64，arm64
# 走 aarch64 工具链交叉编译。arm64 runner 上则原生出 arm64。本地与 CI
# 同一条编译路径，没有 QEMU 模拟下 Rust 慢几十倍的问题。
#
# ── 缓存与预热 ───────────────────────────────────────────────
# type=gha 把 BuildKit 缓存挂到 Actions cache，scope 与 warm-cache.yml
# 的 image job 一致 —— 那边跑过之后，这里的桩依赖层直接命中，只剩源码
# 层重编。两个 registry 在同一次构建里推（不是构建两遍）：镜像目标是一
# 份清单，build-push 一次构建、给每个目标打同一套 tag。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要补发镜像的版本号（不带 v 前缀；对应 tag 必须已存在，留空则对当前分支出 :dev）'
        required: false
        type: string
      initial_latest:
        description: '只用于首次发布：把主分支当前提交构建并打上 :latest（不填 version 时生效）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # 推 GHCR：内置 GITHUB_TOKEN 往本仓库所属的包命名空间写
  packages: write

env:
  RUST_BACKTRACE: 1

jobs:
  # 解析本次构建的 ref 与版本号。tag push 直接取 tag；dispatch 填了版本
  # 就取对应的 v<version> 并先确认远端确有这个 tag —— 免得镜像编完才发
  # 现版本号填错。核心的 checkout 一律用解析出的 ref，保证「镜像 = tag 里
  # 的代码」。
  meta:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 解析版本号与 ref
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          # 内置 token 不会自动进 shell 环境，校验 tag 存在性要显式传
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF="$GITHUB_REF_NAME"
            VERSION="${REF#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
            REF="v$VERSION"
            # 先确认远端确有这个 tag —— 免得镜像编完才发现版本号填错
            HTTP=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$REF")
            if [ "$HTTP" != 200 ]; then
              echo "tag $REF 在远端不存在（HTTP $HTTP），无法构建镜像" >&2
              exit 1
            fi
          else
            # 手动触发且不填版本：对当前分支出 :dev，只做链路验证
            VERSION=""
            REF="$GITHUB_SHA"
          fi
          # 换行或引号会往下面的输出里注入字段
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "版本号不合法: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "构建 $REF（版本 ${VERSION:-无，出 :dev}）"

  image:
    needs: meta
    runs-on: ubuntu-latest
    # 两个 Docker Hub 凭据放在 **job 级 env**：`steps.if` 读不到 secrets
    # 上下文，但读得到 env —— 「配没配」只判定一次，组装目标与登录两步
    # 共用同一份值。没配就是空串。
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      VERSION: ${{ needs.meta.outputs.version }}
      INITIAL_LATEST: ${{ github.event.inputs.initial_latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      # 镜像目标是一份**换行分隔**的清单：GHCR 恒在，Docker Hub 看凭据。
      # 用一个 step output 带下去，后面的 tag 清单按它逐行展开。
      - name: 组装镜像目标
        id: images
        run: |
          set -euo pipefail
          # 镜像仓库名必须全小写，GitHub 仓库名带大写时不能直接用
          # GITHUB_REPOSITORY，否则 buildx 报 repository name must be lowercase
          images=("ghcr.io/$(printf %s "${GITHUB_REPOSITORY}" | tr "[:upper:]" "[:lower:]")")
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            images+=("${DOCKERHUB_USERNAME}/agent2api")
          fi
          {
            echo "list<<IMAGES"
            printf '%s\n' "${images[@]}"
            echo "IMAGES"
          } >> "$GITHUB_OUTPUT"
          echo "本次镜像目标："
          printf '  %s\n' "${images[@]}"

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 没配 Docker Hub 凭据时整步跳过（工作流不会因此变红）
      - name: 登录 Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # 三档 tag 规则，只看 env.VERSION（tag push 与 dispatch 补发走同一条
      # 判断，不必区分触发方式）：
      #   正式版（3.4.3）        → 3.4.3 + latest
      #   预发布（3.4.3-beta.2） → 3.4.3-beta.2 + beta，**不移动 latest**
      #   未填版本（手动测试）   → dev
      # tag 清单自己拼、不用 metadata-action 的 semver 模式：dispatch 补发时
      # github.ref 是分支，semver 模式拿不到版本号，两条路径的规则就会分叉。
      - name: 生成镜像 tag 清单
        id: tags
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            if [ -z "$VERSION" ]; then
              # 首次发布：显式要求时把当前提交当 :latest 的起点
              if [ "$INITIAL_LATEST" = "true" ]; then
                tags+=("$repo:latest")
              else
                tags+=("$repo:dev")
              fi
              continue
            fi
            tags+=("$repo:$VERSION")
            if [[ "$VERSION" == *-* ]]; then
              tags+=("$repo:beta")
            else
              tags+=("$repo:latest")
            fi
          done <<< "${{ steps.images.outputs.list }}"
          {
            echo "list<<TAGS"
            printf '%s\n' "${tags[@]}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "本次推送的 tag："
          printf '  %s\n' "${tags[@]}"

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=Agent2API
            org.opencontainers.image.description=AI routing gateway with Agent client takeover
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          set -euo pipefail
          echo "已推送镜像："
          # TAGS 是多行清单，必须整体作为一个参数交给 printf，
          # 直接内联会被拆成多个带冒号的词、当成命令执行
          printf '  %s\n' "$TAGS"
          if [ -n "$VERSION" ] && [[ "$VERSION" != *-* ]]; then
            echo "  ↑ 正式版：latest 的 Pushed 时间应同步更新"
          elif [ -n "$VERSION" ]; then
            echo "  ↑ 预发布：latest 不应被移动，请核对各镜像库的 latest 时间"
          elif [ "$INITIAL_LATEST" = "true" ]; then
            echo "  ↑ 首次发布：已把当前提交打上 :latest"
          else
            echo "  ↑ 手动测试：只出 dev，不动任何版本标签"
          fi
