---
name: build

# 构建桌面端安装包并挂到本仓库的 GitHub Release 上。
#
# ── 为什么在源码仓内构建（2026-11 起）─────────────────────────
# 此前本文件只做转发：推 v* tag → repository_dispatch 派发上游构建仓
# （Agent2Builder/agent2api-releases）。那是上游的三仓架构（源码仓派发 /
# 构建仓编译 / 索引仓指路，见 .agents/skills/release-flow 第 0.5 节），
# 本 fork（awsl1414）没有构建仓的 secret，推 tag 只会派发失败；而且 fork
# 的包也不该挂到上游名下。本 fork 只需要桌面端，于是改回仓内直构：
# tag 一推，三个平台 job 直接出包，release job 挂到本仓库的 Releases ——
# 全程只用内置 GITHUB_TOKEN（permissions: contents: write），不需要配
# 任何 secret。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · 推送 v* tag：正式发版路径。构建完由 release job 挂 Release，正文取
#     tag 附注（= 发布提交的更新日志，发布提交信息即 Release 正文这条
#     规矩在这里落地）；版本号带 -（beta 预发布）自动标 prerelease ——
#     这道标记就是应用内「加入 beta 版」开关的分界线
#     （core::update::version::is_prerelease_version 同款判据）。
#   · workflow_dispatch(version)：对**已存在**的 tag 重跑构建并补发 ——
#     发布失败（比如附件传了一半）后补附件用，不必删 tag 重打。
#
#   两种触发都 checkout **tag 本身**（meta job 统一解析出 ref），保证
#   「附件 = tag 里的代码」：dispatch 重跑老版本也不会把 main 快照发出去。
#
# ── 与更新检查的衔接 ──────────────────────────────────────────
# 桌面端「设置 → 软件更新」的兜底仓库是 core/update/version.rs 的
# DEFAULT_REPO（本仓库）。注意上游索引（Agent2plugin/Agent2plugin 的
# app.json）可达时仍优先生效，本仓库的 Release 只在索引读不到时兜底被
# 查到 —— 详见该常量的文档注释。
#
# ── 签名 ──────────────────────────────────────────────────────
# 桌面端不签名：macOS 首次打开要在「系统设置 → 隐私与安全性」放行一次，
# Windows 过 SmartScreen 时选「仍要运行」。消除这两步需要 Apple Developer
# 账号与代码签名证书，现阶段没有。
#
# ── 产物（8 个附件）───────────────────────────────────────────
#   Agent2API_<版本>_universal.dmg      macos job（x86_64 + aarch64 合一）
#   Agent2API_<版本>_x64-setup.exe      windows job（NSIS）
#   Agent2API_<版本>_amd64.deb          linux-desktop job
#   Agent2API_<版本>_amd64.AppImage     linux-desktop job
#   └ 每个安装包各带一份 <文件名>.sha256，由 release job 生成
# 文件名里的版本号来自 tauri.conf.json；release job 会核对它与 tag 一致，
# 不一致直接失败 —— 版本号与 tag 对不上的包不能出门。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要构建/补发的版本号（不带 v 前缀；对应 tag 必须已存在）'
        required: true
        type: string

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  # 解析本次构建的 ref 与版本号：tag push 直接取 tag；dispatch 取输入版本
  # 对应的 v<version>，并先确认远端确有此 tag —— 免得三个平台编完才发现
  # 版本号填错。后面所有 job 一律 checkout 这个 ref。
  meta:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 解析版本号与 ref
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF="$GITHUB_REF_NAME"
            VERSION="${REF#v}"
          else
            VERSION="$INPUT_VERSION"
            REF="v$VERSION"
            # dispatch 填错版本号就当场报错，别等三个平台编完才失败
            REMOTE="https://github.com/$GITHUB_REPOSITORY"
            git ls-remote --exit-code "$REMOTE" "refs/tags/$REF" >/dev/null \
              || { echo "tag $REF 在远端不存在，无法构建" >&2; exit 1; }
          fi
          # 换行或引号会往下面的输出里注入字段
          if [[ ! "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "版本号不合法: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "构建 $REF（版本 $VERSION）"

  # ── macOS（universal dmg）────────────────────────────────────
  # universal 目标让 x86_64 与 aarch64 各编一遍再合并，Intel 与 M 芯片都能
  # 原生跑，代价是 Rust 部分编两遍。runner 钉死 macos-26 而不是
  # macos-latest：两者目前同为 arm64 macOS，但 latest 通配标签在 arm64
  # 池子里排队极久（实测连续三次等约 15 分钟后被 cancelled）。
  macos:
    needs: meta
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # 依赖装在 desktop-tauri/ 下（根 package.json 没有依赖），必须显式指路
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 要两个目标都装上（合并时两个架构各编一遍）
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # 缓存 Rust 依赖：冷编译约 10 分钟，命中后大幅缩短。workspaces 与
      # warm-cache.yml 逐字一致 —— 缓存 key 里含 job id 与这段参数，
      # 两边对不上缓存就白存。
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      # 不走 tauri-action：它的默认脚本是 npm run tauri build，而本项目
      # package.json 里这条脚本叫 build（见 desktop-tauri/package.json）。
      # 界面已入库（desktop-tauri/ui/），构建不需要前端步骤。
      - name: 构建 macOS 安装包
        run: >-
          npm --prefix desktop-tauri run build
          -- --target universal-apple-darwin

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          # bundle 目录下还有 .app / .dSYM 等调试产物，不是分发形态
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── Windows（NSIS exe）───────────────────────────────────────
  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # 同 macOS job：依赖在 desktop-tauri/ 下
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Windows 安装包
        run: npm --prefix desktop-tauri run build

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ── Linux 桌面端（deb + AppImage）────────────────────────────
  # Tauri 的 Linux 产物链接 webkit2gtk / gtk3，无法从 macOS / Windows 交叉
  # 编译，只能 Linux 上出。基础 tauri.conf.json 的 targets 是 ["nsis"]
  # （Windows 专用），这里用 --config 覆盖成 deb + appimage（见
  # src-tauri/tauri.linux.conf.json）。
  linux-desktop:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # 同 macOS job：依赖在 desktop-tauri/ 下
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      # ── 系统依赖：Tauri 在 Linux 上的硬要求 ──────────────────────
      # webkit2gtk-4.1 是 WebView 本体（Tauri 2 用 4.1 = libsoup3 一代）；
      # gtk3 是窗口层；libayatana-appindicator3 是**托盘**（本应用关窗后
      # 的唯一入口，缺它托盘建不起来）；librsvg2 供图标渲染；patchelf 是
      # bundler 给 AppImage 改 RPATH 时调的。缺任何一个都在 tauri build
      # 阶段报错，而不是编译期。
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential
          # FUSE 只在「直接运行 AppImage 工具」时才需要；tauri bundler 跑
          # linuxdeploy 走自解压（APPIMAGE_EXTRACT_AND_RUN），构建不强依赖
          # 它，补一份以防 bundler 换实现。24.04 起包名是 libfuse2t64
          # （旧的 libfuse2 已不存在），装不上就跳过，不当失败处理。
          sudo apt-get install -y --no-install-recommends \
            libfuse2t64 2>/dev/null \
            || echo "libfuse2t64 不可用，跳过（构建 AppImage 不强依赖 FUSE）"
          # 打印实际版本：排查「构建机换代导致行为变化」时这是第一条线索
          pkg-config --modversion webkit2gtk-4.1 gtk+-3.0 \
            ayatana-appindicator3-0.1

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Linux 桌面端安装包
        run: >-
          npm --prefix desktop-tauri run build
          -- --config src-tauri/tauri.linux.conf.json

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: linux-desktop
          # deb 与 AppImage 分属两个目录；upload-artifact 以两者共同的祖先
          # 目录为根，附件里带 deb/ / appimage/ 一层子目录，release job 会摊平
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ── 发布 ─────────────────────────────────────────────────────
  # 四个安装包各补一份 .sha256 后挂 Release。正文 = tag 附注（annotated tag
  # 的 contents）= 发布提交里的更新日志，逐字一致，不追加任何说明行。
  # 幂等：Release 已存在（补附件重跑）就改标题 / 正文 / 预发布标记后覆盖
  # 上传，不存在才 create —— 「删旧 tag 重打」与「dispatch 补发」两条
  # 重试路都走得通。上传逐文件 --clobber：gh 批量上传遇到「附件已存在」
  # 会报 HTTP 422 中断整批，--clobber 让重跑天然幂等。
  release:
    needs: [meta, macos, windows, linux-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          # 读 tag 附注要拿到 annotated tag 对象本身，浅克隆拿不到
          fetch-depth: 0

      - name: 下载三个平台的产物
        uses: actions/download-artifact@v7
        with:
          pattern: '{macos-universal,windows-nsis,linux-desktop}'
          merge-multiple: true
          path: dist

      - name: 摊平目录、生成校验和并核对版本号
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          # linux 产物带 deb/ / appimage/ 一层子目录（见 linux-desktop 的
          # 上传注释），统一摊平再清掉空目录
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          shopt -s nullglob
          installers=( *.dmg *.exe *.deb *.AppImage )
          if [[ ${#installers[@]} -ne 4 ]]; then
            echo "期望 4 个安装包，实际 ${#installers[@]} 个" >&2
            ls -l >&2
            exit 1
          fi
          # 资产名里的版本号由 tauri.conf.json 决定，tag 决定发到哪；两者
          # 不一致说明六处版本号没跟 tag 走，这种包不能挂出去
          for f in "${installers[@]}"; do
            if [[ "$f" != *"$VERSION"* ]]; then
              echo "$f 不含版本号 $VERSION：版本号与 tag 不一致" >&2
              exit 1
            fi
            sha256sum "$f" > "$f.sha256"
          done
          cat ./*.sha256
          ls -lh

      - name: 挂 Release 并上传附件
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF: ${{ needs.meta.outputs.ref }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # 附注取 annotated tag 的 contents；轻量 tag 会回落成提交信息
          git tag -l --format='%(contents)' "$REF" > /tmp/notes.md
          # 版本号带 - 即预发布（与 core::update::version::is_prerelease_version
          # 同一条约定：tag 带 `-` ↔ 标 pre-release）
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          # 已 checkout 本仓库，gh 能从 remote 自认仓库，不必 --repo
          if gh release view "$REF" >/dev/null 2>&1
          then
            gh release edit "$REF" \
              --title "Agent2API $VERSION" \
              --notes-file /tmp/notes.md --prerelease="$PRERELEASE"
          else
            CREATE_ARGS=(
              --verify-tag
              --title "Agent2API $VERSION"
              --notes-file /tmp/notes.md
            )
            if [[ "$PRERELEASE" == true ]]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "$REF" "${CREATE_ARGS[@]}"
          fi
          gh release upload "$REF" dist/* --clobber
          echo "发布完成：https://github.com/$GITHUB_REPOSITORY/releases/tag/$REF"
