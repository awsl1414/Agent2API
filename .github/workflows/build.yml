---
name: build

# 构建桌面端安装包并挂到本仓库的 GitHub Release 上。
#
# ── 为什么在源码仓内构建（2026-11 起）─────────────────────────
# 此前本文件只做转发：推 v* tag → repository_dispatch 派发上游构建仓
# （Agent2Builder/agent2api-releases）。那是上游的三仓架构（源码仓派发 /
# 构建仓编译 / 索引仓指路，见 .agents/skills/release-flow 第 0.5 节），
# 本 fork（awsl1414）没有构建仓的 secret，推 tag 只会派发失败；而且 fork
# 的包也不该挂到上游名下。本 fork 只需要桌面端，于是改回仓内直构：
# tag 一推，三个平台 job 直接出包，release job 挂到本仓库的 Releases ——
# 全程只用内置 GITHUB_TOKEN（permissions: contents: write），不需要配
# 任何 secret。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · 推送 v* tag：正式发版路径。构建完由 release job 挂 Release，正文由
#     tag 附注（= 发布提交的更新日志，发布提交信息即 Release 正文这条
#     规矩在这里落地）解析成分节 Markdown，再固定追加「## 说明」；
#     版本号带 -（beta 预发布）自动标 prerelease ——
#     这道标记就是应用内「加入 beta 版」开关的分界线
#     （core::update::version::is_prerelease_version 同款判据）。
#   · workflow_dispatch(version)：对**已存在**的 tag 重跑构建并补发 ——
#     发布失败（比如附件传了一半）后补附件用，不必删 tag 重打。
#
#   两种触发都 checkout **tag 本身**（meta job 统一解析出 ref），保证
#   「附件 = tag 里的代码」：dispatch 重跑老版本也不会把 main 快照发出去。
#
# ── 与更新检查的衔接 ──────────────────────────────────────────
# 桌面端「设置 → 软件更新」的兜底仓库是 core/update/version.rs 的
# DEFAULT_REPO（本仓库）。注意上游索引（Agent2plugin/Agent2plugin 的
# app.json）可达时仍优先生效，本仓库的 Release 只在索引读不到时兜底被
# 查到 —— 详见该常量的文档注释。
#
# ── 签名 ──────────────────────────────────────────────────────
# 桌面端不签名：macOS 首次打开要在「系统设置 → 隐私与安全性」放行一次，
# Windows 过 SmartScreen 时选「仍要运行」。消除这两步需要 Apple Developer
# 账号与代码签名证书，现阶段没有。
#
# ── 产物（12 个附件）─────────────────────────────────────────
#   Agent2API_<版本>_universal.dmg      macos job（x86_64 + aarch64 合一）
#   Agent2API_<版本>_x64-setup.exe      windows job（NSIS）
#   Agent2API_<版本>_amd64.deb          linux-desktop job
#   Agent2API_<版本>_amd64.AppImage     linux-desktop job
#   agent2api-server-linux-amd64.tar.gz   linux-server job（无 GUI）
#   agent2api-server-linux-arm64.tar.gz   linux-server job（无 GUI）
#   └ 每个包各带一份 <文件名>.sha256，由 release job 生成
# 文件名里的版本号来自 tauri.conf.json；release job 会核对它与 tag 一致，
# 不一致直接失败 —— 版本号与 tag 对不上的包不能出门。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要构建/补发的版本号（不带 v 前缀；对应 tag 必须已存在）'
        required: true
        type: string

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  # 解析本次构建的 ref 与版本号：tag push 直接取 tag；dispatch 取输入版本
  # 对应的 v<version>，并先确认远端确有此 tag —— 免得三个平台编完才发现
  # 版本号填错。后面所有 job 一律 checkout 这个 ref。
  meta:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 解析版本号与 ref
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF="$GITHUB_REF_NAME"
            VERSION="${REF#v}"
          else
            VERSION="$INPUT_VERSION"
            REF="v$VERSION"
            # dispatch 填错版本号就当场报错，别等三个平台编完才失败
            REMOTE="https://github.com/$GITHUB_REPOSITORY"
            git ls-remote --exit-code "$REMOTE" "refs/tags/$REF" >/dev/null \
              || { echo "tag $REF 在远端不存在，无法构建" >&2; exit 1; }
          fi
          # 换行或引号会往下面的输出里注入字段
          if [[ ! "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "版本号不合法: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "构建 $REF（版本 $VERSION）"

  # ── macOS（universal dmg）────────────────────────────────────
  # universal 目标让 x86_64 与 aarch64 各编一遍再合并，Intel 与 M 芯片都能
  # 原生跑，代价是 Rust 部分编两遍。runner 钉死 macos-26 而不是
  # macos-latest：两者目前同为 arm64 macOS，但 latest 通配标签在 arm64
  # 池子里排队极久（实测连续三次等约 15 分钟后被 cancelled）。
  macos:
    needs: meta
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # 依赖装在 desktop-tauri/ 下（根 package.json 没有依赖），必须显式指路
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 要两个目标都装上（合并时两个架构各编一遍）
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # 缓存 Rust 依赖：冷编译约 10 分钟，命中后大幅缩短。workspaces 与
      # warm-cache.yml 逐字一致 —— 缓存 key 里含 job id 与这段参数，
      # 两边对不上缓存就白存。
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      # 不走 tauri-action：它的默认脚本是 npm run tauri build，而本项目
      # package.json 里这条脚本叫 build（见 desktop-tauri/package.json）。
      # 界面已入库（desktop-tauri/ui/），构建不需要前端步骤。
      - name: 构建 macOS 安装包
        run: >-
          npm --prefix desktop-tauri run build
          -- --target universal-apple-darwin

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          # bundle 目录下还有 .app / .dSYM 等调试产物，不是分发形态
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── Windows（NSIS exe）───────────────────────────────────────
  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # 同 macOS job：依赖在 desktop-tauri/ 下
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Windows 安装包
        run: npm --prefix desktop-tauri run build

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ── Linux 桌面端（deb + AppImage）────────────────────────────
  # Tauri 的 Linux 产物链接 webkit2gtk / gtk3，无法从 macOS / Windows 交叉
  # 编译，只能 Linux 上出。基础 tauri.conf.json 的 targets 是 ["nsis"]
  # （Windows 专用），这里用 --config 覆盖成 deb + appimage（见
  # src-tauri/tauri.linux.conf.json）。
  linux-desktop:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # 同 macOS job：依赖在 desktop-tauri/ 下
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      # ── 系统依赖：Tauri 在 Linux 上的硬要求 ──────────────────────
      # webkit2gtk-4.1 是 WebView 本体（Tauri 2 用 4.1 = libsoup3 一代）；
      # gtk3 是窗口层；libayatana-appindicator3 是**托盘**（本应用关窗后
      # 的唯一入口，缺它托盘建不起来）；librsvg2 供图标渲染；patchelf 是
      # bundler 给 AppImage 改 RPATH 时调的。缺任何一个都在 tauri build
      # 阶段报错，而不是编译期。
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential
          # FUSE 只在「直接运行 AppImage 工具」时才需要；tauri bundler 跑
          # linuxdeploy 走自解压（APPIMAGE_EXTRACT_AND_RUN），构建不强依赖
          # 它，补一份以防 bundler 换实现。24.04 起包名是 libfuse2t64
          # （旧的 libfuse2 已不存在），装不上就跳过，不当失败处理。
          sudo apt-get install -y --no-install-recommends \
            libfuse2t64 2>/dev/null \
            || echo "libfuse2t64 不可用，跳过（构建 AppImage 不强依赖 FUSE）"
          # 打印实际版本：排查「构建机换代导致行为变化」时这是第一条线索
          pkg-config --modversion webkit2gtk-4.1 gtk+-3.0 \
            ayatana-appindicator3-0.1

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Linux 桌面端安装包
        run: >-
          npm --prefix desktop-tauri run build
          -- --config src-tauri/tauri.linux.conf.json

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: linux-desktop
          # deb 与 AppImage 分属两个目录；upload-artifact 以两者共同的祖先
          # 目录为根，附件里带 deb/ / appimage/ 一层子目录，release job 会摊平
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ── Linux 服务端包（无 GUI，注册成 systemd 服务）──────────────
  # 两份用途共用同一个包：
  #   · 裸机安装：解包后跑 packaging/linux/install.sh，装成 systemd 服务；
  #   · 容器内一键更新：selfupdate 模块按名取包内的 agent2api-server 与
  #     ui/，原地替换后优雅退出、由 restart 策略拉起同一个容器。
  #
  # 走 Dockerfile 的 bundle 阶段而不是直接 cargo build：那条路径已经验证过
  # amd64 原生 / arm64 交叉编译，产出的可执行文件与镜像里那份同源同工具链，
  # glibc 版本天然对齐（不变量见 Dockerfile 的 bundle 阶段注释）。bundle 是
  # FROM scratch + 纯 COPY，导出时不进 QEMU。
  #
  # 包名与版本号**必须**与 update/version.rs 的 server_bundle_name() 逐字
  # 一致：面板按这个名字在 Release 资产里找包，找不到就拒绝安装。
  linux-server:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建服务端二进制与界面
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --target bundle \
            --output type=local,dest=out \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: 打包并生成校验和
        run: |
          set -euo pipefail
          name="agent2api-server-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          rm -rf stage/pkg
          mkdir -p stage/pkg
          # 包内布局：agent2api-server 与 ui/ 在根下，是容器内更新链的
          # 硬约定；install.sh / 单元文件 / env 样例跟它们同级，更新链读完
          # 即丢，裸机安装则正好用上。
          cp -r out/bundle/agent2api-server out/bundle/ui stage/pkg/
          cp packaging/linux/install.sh \
             packaging/linux/agent2api.service \
             packaging/linux/agent2api.env.example stage/pkg/
          # 不能「先 tar 再 -r 追加」：gzip 流无法原地追加，
          # tar 会直接报 "Cannot update compressed archives"
          tar -C stage/pkg -czf "dist/$name" agent2api-server ui \
            install.sh agent2api.service agent2api.env.example
          ( cd dist && sha256sum "$name" > "$name.sha256" )
          cat "dist/$name.sha256"
          ls -lh dist
          echo "── 包内条目（前 20 行）──"
          # 不能写 `tar -tzf ... | head`：head 读完就关管道，tar 收到 SIGPIPE
          # 报 "stdout: write error"，在 pipefail 下整步失败
          tar -tzf "dist/$name" > /tmp/bundle-entries.txt
          sed -n '1,20p' /tmp/bundle-entries.txt

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: linux-server-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ── 发布 ─────────────────────────────────────────────────────
  # 六个包（四个桌面端安装包 + 两个架构的服务端包）各补一份 .sha256 后挂
  # Release。正文不是 tag 附注的逐字照搬：解析步按行首类别前缀把它拆成
  # 分节 Markdown，末尾固定追加「## 说明」；一条条目都解析不出来就直接
  # 失败——多半是 tag 忘了写更新日志，空正文挂出去还得手工返工。
  # 幂等：Release 已存在（补附件重跑）就改标题 / 正文 / 预发布标记后覆盖
  # 上传，不存在才 create —— 「删旧 tag 重打」与「dispatch 补发」两条
  # 重试路都走得通。上传逐文件 --clobber：gh 批量上传遇到「附件已存在」
  # 会报 HTTP 422 中断整批，--clobber 让重跑天然幂等。
  release:
    needs: [meta, macos, windows, linux-desktop, linux-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          # 读 tag 附注要拿到 annotated tag 对象本身，浅克隆拿不到
          fetch-depth: 0

      - name: 下载各平台的产物
        uses: actions/download-artifact@v7
        with:
          pattern: '{macos-universal,windows-nsis,linux-desktop,linux-server-*}'
          merge-multiple: true
          path: dist

      - name: 摊平目录、生成校验和并核对版本号
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          # linux 产物带 deb/ / appimage/ 一层子目录（见 linux-desktop 的
          # 上传注释），统一摊平再清掉空目录
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          shopt -s nullglob
          installers=( *.dmg *.exe *.deb *.AppImage )
          if [[ ${#installers[@]} -ne 4 ]]; then
            echo "期望 4 个安装包，实际 ${#installers[@]} 个" >&2
            ls -l >&2
            exit 1
          fi
          # 资产名里的版本号由 tauri.conf.json 决定，tag 决定发到哪；两者
          # 不一致说明六处版本号没跟 tag 走，这种包不能挂出去
          for f in "${installers[@]}"; do
            if [[ "$f" != *"$VERSION"* ]]; then
              echo "$f 不含版本号 $VERSION：版本号与 tag 不一致" >&2
              exit 1
            fi
            sha256sum "$f" > "$f.sha256"
          done
          # 服务端包名不带版本号（面板按 server_bundle_name() 逐字找），
          # 所以只核对数量与校验和
          servers=( agent2api-server-linux-*.tar.gz )
          if [[ ${#servers[@]} -ne 2 ]]; then
            echo "期望 2 个服务端包（amd64 / arm64），实际 ${#servers[@]} 个" >&2
            ls -l >&2
            exit 1
          fi
          for f in "${servers[@]}"; do
            sha256sum -c "$f.sha256"
          done
          cat ./*.sha256
          ls -lh

      # ── 发布正文：把 tag 附注解析成分节 Markdown ─────────────────
# 附注（= 发布提交的更新日志）是「N. 类别：内容」的扁平清单，逐字
# 挂出去没有结构。解析规则：条目按行首类别前缀归入 修复/变更/新增/
# 优化/插件/文档 六节并统一从 1 编号；条目开始前的首个非空行是版本说明
# 标题，作「## 概述」；「版本：」行只是版本号记录，不上正文；归不
# 了类的行进「## 其他」而不是丢掉——问题在发布前肉眼可见。末尾
# 固定追加「## 说明」（未签名提示 + 更新通道指向本仓库）。将来
# 新增类别时在 item_re 补一个词、case 里补一行。
      - name: 解析发布正文
        env:
          REF: ${{ needs.meta.outputs.ref }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # 附注取 annotated tag 的 contents；轻量 tag 会回落成提交信息。
          # 签名 tag 的 contents 末尾带 PGP armor（正文末尾的固定收尾块），
          # 从 BEGIN 行删到结尾即可；$ 是 sed 的行尾锚点，双引号里转义
          armor_re="/^-----BEGIN PGP SIGNATURE-----\$/,\$d"
          git tag -l --format='%(contents)' "$REF" \
            | sed "$armor_re" \
            > /tmp/tag-message.txt

          # 条目行 = 可选列表标记 + 类别前缀，12. 修复：xxx、- 新增：xxx、
          # 修复：xxx 都算；标记与类别间的空格可有可无。类别清单与
          # 提交规范一致
          marker='([[:space:]]*([-*][[:space:]]+|[0-9]+[.、)][[:space:]]*))?'
          item_re="^${marker}(修复|变更|新增|优化|插件|文档)：(.*)\$"
          version_re="^${marker}版本："
          overview=''
          fix='' chg='' add='' opt='' plg='' doc='' other=''
          seen_item=0
          while IFS= read -r line; do
            line=${line%$'\r'}
            [[ -n "${line//[[:space:]]/}" ]] || continue
            if [[ $line =~ $item_re ]]; then
              # 只有前缀没有内容的行（手滑写出的空「修复：」）不算条目
              [[ -n "${BASH_REMATCH[4]//[[:space:]]/}" ]] || continue
              case ${BASH_REMATCH[3]} in
                修复) fix+="${BASH_REMATCH[4]}"$'\n' ;;
                变更) chg+="${BASH_REMATCH[4]}"$'\n' ;;
                新增) add+="${BASH_REMATCH[4]}"$'\n' ;;
                优化) opt+="${BASH_REMATCH[4]}"$'\n' ;;
                插件) plg+="${BASH_REMATCH[4]}"$'\n' ;;
                文档) doc+="${BASH_REMATCH[4]}"$'\n' ;;
              esac
              seen_item=1
            elif [[ $line =~ $version_re ]]; then
              :
            elif [[ $seen_item == 0 ]]; then
              # 标题文本剥掉手写的 markdown 井号后直接当概述段落；
              # 剥完为空的行（光杆井号）不占标题位
              candidate=$line
              while [[ $candidate == '#'* ]]; do
                candidate=${candidate#'#'}
              done
              candidate=${candidate#"${candidate%%[![:space:]]*}"}
              if [[ -n $candidate ]]; then
                overview=$candidate
                seen_item=1
              fi
            else
              other+="$line"$'\n'
            fi
          done < /tmp/tag-message.txt

          # 附注里一条内容都解析不出来时，这种只剩「## 说明」的空正文
          # 挂出去还得返工，直接失败把问题挡在发布前
          if [[ -z "$overview$fix$chg$add$opt$plg$doc$other" ]]; then
            echo "tag $REF 的附注里没有可解析的更新日志条目，拒绝发布空正文" >&2
            cat /tmp/tag-message.txt >&2
            exit 1
          fi

          # 一节一条标题；节内统一从 1 重新编号——源清单的序号跨类别连排，
          # 拆节后照抄会出现 8. 9. 开头的孤节
          emit() {
            local title=$1 body=$2 n=1 item
            [[ -n $body ]] || return 0
            echo "## $title"
            while IFS= read -r item; do
              [[ -n $item ]] || continue
              echo "$n. $item"
              n=$((n + 1))
            done <<< "$body"
            echo
          }

          {
            if [[ -n $overview ]]; then
              echo '## 概述'
              echo "$overview"
              echo
            fi
            emit 修复 "$fix"
            emit 变更 "$chg"
            emit 新增 "$add"
            emit 优化 "$opt"
            emit 插件 "$plg"
            emit 文档 "$doc"
            emit 其他 "$other"
            echo '## 说明'
            # 未签名提示是两个版本形态共用的尾巴；预发布在前面点明 fork
            # 身份，正式版只留提示本身
            unsigned='桌面安装包未签名——macOS 首次打开需右键→打开，'
            unsigned+='Windows 可能提示 SmartScreen（与上游桌面端同形态）'
            if [[ "$VERSION" == *-* ]]; then
              echo "- 本版为 fork 预发布（prerelease）；$unsigned"
            else
              echo "- $unsigned"
            fi
            # 桌面端「软件更新」的兜底仓库就是本仓库（core/update/version.rs
            # 的 DEFAULT_REPO），通道说明跟着仓库走
            echo '- 自动更新通道已指向本仓库 Releases'
            # 服务端包同样在本仓库，容器内一键更新按 release 资产名取包。
            # 不提这句的话，Docker 用户点「下载并更新」失败时无从判断是
            # 包没挂上还是通道指向了别处
            echo '- 容器内一键更新使用本仓库 Release 中的服务端包'
          } > /tmp/notes.md

          # 版本号带 - 即预发布（与 core::update::version::is_prerelease_version
          # 同一条约定：tag 带 `-` ↔ 标 pre-release）；挂 Release 一步用同一个值
          if [[ "$VERSION" == *-* ]]; then
            echo 'PRERELEASE=true' >> "$GITHUB_ENV"
          else
            echo 'PRERELEASE=false' >> "$GITHUB_ENV"
          fi
          cat /tmp/notes.md

      - name: 挂 Release 并上传附件
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF: ${{ needs.meta.outputs.ref }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # /tmp/notes.md 与 PRERELEASE 都出自上一步的解析，这一步只管 gh
          # 的编辑 / 创建 / 传附件；已 checkout 本仓库，gh 能从 remote
          # 自认仓库，不必 --repo
          if gh release view "$REF" >/dev/null 2>&1
          then
            gh release edit "$REF" \
              --title "Agent2API $VERSION" \
              --notes-file /tmp/notes.md --prerelease="$PRERELEASE"
          else
            CREATE_ARGS=(
              --verify-tag
              --title "Agent2API $VERSION"
              --notes-file /tmp/notes.md
            )
            if [[ "$PRERELEASE" == true ]]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "$REF" "${CREATE_ARGS[@]}"
          fi
          gh release upload "$REF" dist/* --clobber
          echo "发布完成：https://github.com/$GITHUB_REPOSITORY/releases/tag/$REF"
